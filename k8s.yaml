apiVersion: v1
kind: Namespace
metadata:
  name: cads-finance
---
apiVersion: v1
kind: Secret
metadata:
  name: cads-finance-secrets
  namespace: cads-finance
type: Opaque
stringData:
  # The database connection string. Kubernetes will securely encode this in base64.
  # Replace with your actual production database connection parameters.
  database-connection-string: "Server=YOUR_SERVER;Database=YOUR_DATABASE;User Id=YOUR_USER;Password=YOUR_PASSWORD;Encrypt=True;TrustServerCertificate=True;MultipleActiveResultSets=True;"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cads-finance-api
  namespace: cads-finance
  labels:
    app: cads-finance-api
spec:
  replicas: 2 # Running 2 replicas for high availability (HA)
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1 # Standard safe rolling update strategy
      maxUnavailable: 0
  selector:
    matchLabels:
      app: cads-finance-api
  template:
    metadata:
      labels:
        app: cads-finance-api
    spec:
      # Enhancing security by running the pod as non-root user (configured in Dockerfile)
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000

      containers:
        - name: api
          image: cadsfinance:latest # Replace with your container registry path, e.g., gcr.io/your-project/cadsfinance:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          
          # Production resource limits to ensure pod stability and prevent noisy neighbor issues
          resources:
            limits:
              cpu: "500m"
              memory: "512Mi"
            requests:
              cpu: "100m"
              memory: "256Mi"

          # Injecting environment variables for ASP.NET Core
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: "Production"
            - name: ConnectionStrings__DefaultConnection
              valueFrom:
                secretKeyRef:
                  name: cads-finance-secrets
                  key: database-connection-string

          # Kubernetes Liveness and Readiness probes using the native health check endpoint
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: cads-finance-service
  namespace: cads-finance
  labels:
    app: cads-finance-api
spec:
  type: ClusterIP # Internal cluster communication. Use Ingress for external access.
  ports:
    - port: 80
      targetPort: 8080
      protocol: TCP
      name: http
  selector:
    app: cads-finance-api
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cads-finance-ingress
  namespace: cads-finance
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "false" # Set to true once SSL is configured
    nginx.ingress.kubernetes.io/use-regex: "true"
spec:
  rules:
    - host: finance.cads.vn # Change to your actual domain name
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cads-finance-service
                port:
                  number: 80
