services:
  cadsfinance:
    build:
      context: .
      dockerfile: Dockerfile
    image: cadsfinance:local
    container_name: cadsfinance
    ports:
      - "5000:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      Swagger__Enabled: "true"
    restart: unless-stopped
